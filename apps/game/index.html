<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cryptgrid: Vault of Shadows</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0e12;
        color: #b8b2a4;
        font-family: Georgia, "Times New Roman", serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 10px;
        font-size: 13px;
        letter-spacing: 0.06em;
        opacity: 0.8;
        pointer-events: none;
        user-select: none;
      }
      #vitals {
        position: fixed;
        left: 12px;
        top: 12px;
        pointer-events: none;
        user-select: none;
        font-size: 11px;
        letter-spacing: 0.03em;
      }
      .vital-block {
        margin-bottom: 8px;
        padding: 3px 4px;
        border-radius: 3px;
        border: 1px solid transparent;
      }
      .vital-block-active {
        border-color: #c9a24a;
        background: rgba(201, 162, 74, 0.08);
      }
      .vital-slot-label {
        font-size: 10px;
        font-weight: bold;
        opacity: 0.6;
        margin-bottom: 2px;
      }
      .vital-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 2px;
      }
      .vital-label {
        width: 18px;
        opacity: 0.8;
        font-size: 10px;
      }
      .vital-track {
        position: relative;
        width: 92px;
        height: 8px;
        background: #1a1b1f;
        border: 1px solid #2e3136;
        border-radius: 2px;
        overflow: hidden;
      }
      .vital-fill {
        position: absolute;
        inset: 0;
        width: 0%;
        transition:
          width 300ms ease-out,
          background 300ms ease-out;
      }
      .vital-hunger-status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px;
        font-weight: bold;
        color: #f5efe0;
        text-shadow:
          0 0 2px #000,
          0 0 2px #000;
        white-space: nowrap;
        pointer-events: none;
      }
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(5, 5, 8, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .sheet-backdrop[hidden] {
        display: none;
      }
      .sheet-card {
        width: min(420px, 90vw);
        max-height: 80vh;
        overflow-y: auto;
        background: #16171c;
        border: 1px solid #3a3d42;
        border-radius: 4px;
        padding: 20px 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }
      .sheet-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid #2e3136;
        padding-bottom: 10px;
        margin-bottom: 14px;
      }
      .sheet-name {
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      .sheet-hint {
        font-size: 11px;
        opacity: 0.55;
        font-style: italic;
      }
      .sheet-section {
        margin-bottom: 16px;
      }
      .sheet-section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        opacity: 0.6;
        margin-bottom: 6px;
      }
      .sheet-vital-row {
        font-size: 13px;
        margin-bottom: 3px;
      }
      .sheet-attr-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .sheet-attr {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        background: #1a1b1f;
        border: 1px solid #2e3136;
        border-radius: 3px;
        padding: 4px 8px;
      }
      .sheet-attr-label {
        opacity: 0.65;
      }
      .sheet-class-row {
        font-size: 13px;
        margin-bottom: 3px;
      }
      .sheet-empty {
        font-size: 12px;
        opacity: 0.5;
        font-style: italic;
      }
      .sheet-hands {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .sheet-hand {
        font-size: 13px;
        background: #1a1b1f;
        border: 1px solid #2e3136;
        border-radius: 3px;
        padding: 4px 8px;
      }
      .sheet-inventory-row {
        font-size: 13px;
        margin-bottom: 3px;
      }
      .sheet-inventory-consumable {
        cursor: pointer;
        color: #c9a24a;
      }
      .sheet-inventory-consumable:hover {
        text-decoration: underline;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 64px;
        transform: translateX(-50%);
        max-width: 60vw;
        background: rgba(15, 16, 20, 0.85);
        border: 1px solid #3a3d42;
        border-radius: 4px;
        padding: 10px 18px;
        font-size: 15px;
        font-style: italic;
        letter-spacing: 0.04em;
        pointer-events: none;
        user-select: none;
      }
      #toast[hidden] {
        display: none;
      }
      #held-item-cursor {
        position: fixed;
        left: 0;
        top: 0;
        display: flex;
        gap: 4px;
        pointer-events: none;
        z-index: 20;
      }
      #held-item-cursor[hidden] {
        display: none;
      }
      .held-item-icon {
        width: 32px;
        height: 32px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.7));
      }
      .held-item-icon[hidden] {
        display: none;
      }
      .rune-panel {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 460px;
        background: rgba(15, 16, 20, 0.92);
        border: 1px solid #3a3d42;
        border-radius: 4px;
        padding: 12px 14px;
        user-select: none;
        z-index: 5;
      }
      .rune-panel[hidden] {
        display: none;
      }
      .rune-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 13px;
        letter-spacing: 0.08em;
        border-bottom: 1px solid #2e3136;
        padding-bottom: 6px;
        margin-bottom: 8px;
      }
      .rune-hint {
        font-size: 10px;
        opacity: 0.55;
        font-style: italic;
      }
      .rune-sequence {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        margin-bottom: 8px;
        font-size: 12px;
        color: #d8cfa0;
      }
      .rune-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #1a1b1f;
        border: 1px solid #3a3d42;
        border-radius: 3px;
        padding: 2px 6px;
      }
      .rune-chip svg {
        width: 18px;
        height: 18px;
      }
      .rune-spell-label {
        font-style: italic;
        opacity: 0.85;
      }
      .rune-tier-row {
        display: flex;
        align-items: stretch;
        gap: 4px;
        margin-bottom: 6px;
      }
      .rune-tier-label {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0.5;
        display: flex;
        align-items: center;
      }
      .rune-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        background: #1a1b1f;
        border: 1px solid #3a3d42;
        border-radius: 3px;
        padding: 5px 2px 3px;
        color: #d8cfa0;
        cursor: pointer;
        font-family: inherit;
      }
      .rune-btn:hover {
        border-color: #c9a24a;
        color: #f0e6c0;
      }
      .rune-btn svg {
        width: 24px;
        height: 24px;
      }
      .rune-btn-caption {
        font-size: 9px;
        opacity: 0.75;
        white-space: nowrap;
      }
      .rune-btn-poor {
        color: #6b4a42;
        opacity: 0.6;
      }
      .rune-invoke {
        width: 100%;
        background: #2a2416;
        border: 1px solid #c9a24a;
        border-radius: 3px;
        color: #e8d9a0;
        font-family: inherit;
        font-size: 13px;
        letter-spacing: 0.1em;
        padding: 6px 0;
        cursor: pointer;
      }
      .rune-invoke:hover {
        background: #3a3220;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vitals"></div>
    <div id="hud"></div>
    <div id="character-sheet"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

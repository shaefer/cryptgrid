name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather
# than cancel it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # apps/game at the site root, apps/editor under /editor/ (docs/ARCHITECTURE.md
      # CI/CD). Each app's vite.config.ts reads CRYPTGRID_BASE for its `base`.
      - name: Build game
        run: pnpm --filter @cryptgrid/game build
        env:
          CRYPTGRID_BASE: /cryptgrid/
      - name: Build editor
        run: pnpm --filter @cryptgrid/editor build
        env:
          CRYPTGRID_BASE: /cryptgrid/editor/

      - name: Assemble Pages output
        run: |
          set -e
          mkdir -p pages-dist/editor
          cp -r apps/game/dist/. pages-dist/
          cp -r apps/editor/dist/. pages-dist/editor/
          touch pages-dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

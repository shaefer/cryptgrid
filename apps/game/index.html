<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cryptgrid: Vault of Shadows</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0e12;
        color: #b8b2a4;
        font-family: Georgia, "Times New Roman", serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 10px;
        font-size: 13px;
        letter-spacing: 0.06em;
        opacity: 0.8;
        pointer-events: none;
        user-select: none;
      }
      #vitals {
        position: fixed;
        left: 12px;
        top: 12px;
        pointer-events: none;
        user-select: none;
        font-size: 11px;
        letter-spacing: 0.03em;
      }
      .vital-block {
        margin-bottom: 8px;
      }
      .vital-slot-label {
        font-size: 10px;
        font-weight: bold;
        opacity: 0.6;
        margin-bottom: 2px;
      }
      .vital-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 2px;
      }
      .vital-label {
        width: 18px;
        opacity: 0.8;
        font-size: 10px;
      }
      .vital-track {
        position: relative;
        width: 92px;
        height: 8px;
        background: #1a1b1f;
        border: 1px solid #2e3136;
        border-radius: 2px;
        overflow: hidden;
      }
      .vital-fill {
        position: absolute;
        inset: 0;
        width: 0%;
        transition:
          width 300ms ease-out,
          background 300ms ease-out;
      }
      .vital-hunger-status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px;
        font-weight: bold;
        color: #f5efe0;
        text-shadow:
          0 0 2px #000,
          0 0 2px #000;
        white-space: nowrap;
        pointer-events: none;
      }
      .sheet-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(5, 5, 8, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .sheet-backdrop[hidden] {
        display: none;
      }
      .sheet-card {
        width: min(420px, 90vw);
        max-height: 80vh;
        overflow-y: auto;
        background: #16171c;
        border: 1px solid #3a3d42;
        border-radius: 4px;
        padding: 20px 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }
      .sheet-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid #2e3136;
        padding-bottom: 10px;
        margin-bottom: 14px;
      }
      .sheet-name {
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      .sheet-hint {
        font-size: 11px;
        opacity: 0.55;
        font-style: italic;
      }
      .sheet-section {
        margin-bottom: 16px;
      }
      .sheet-section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        opacity: 0.6;
        margin-bottom: 6px;
      }
      .sheet-vital-row {
        font-size: 13px;
        margin-bottom: 3px;
      }
      .sheet-attr-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .sheet-attr {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        background: #1a1b1f;
        border: 1px solid #2e3136;
        border-radius: 3px;
        padding: 4px 8px;
      }
      .sheet-attr-label {
        opacity: 0.65;
      }
      .sheet-class-row {
        font-size: 13px;
        margin-bottom: 3px;
      }
      .sheet-empty {
        font-size: 12px;
        opacity: 0.5;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vitals"></div>
    <div id="hud"></div>
    <div id="character-sheet"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
